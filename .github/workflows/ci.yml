name: ci

# Gating check for the sdcc88 port. Builds the SDCC overlay + the binary
# toolchain (sdas88 / sdldz80 / romgen / emulator runner) and runs the unified
# test suite (scripts/run-tests.sh — corpus byte-identity, emu execution,
# host-vs-emulator diff, and the toolchain smokes) as one TAP stream.
#
# The job name "build & test" is the required status check on main: a PR cannot
# merge unless this is green.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Cache the SDCC build tree (fetch + configure + base compile). build.sh is
      # incremental: on a cache hit it reuses the configured tree and only the
      # overlaid s1c88 port is re-made. Keyed on the build recipe + the overlay
      # patch, NOT on src/s1c88, so the cache is shared across PRs and the port is
      # always rebuilt fresh from the current sources by build.sh / run-tests.sh.
      - name: Cache SDCC build tree
        uses: actions/cache@v4
        with:
          path: build
          key: sdcc-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.sh', 'third_party/sdcc/*.patch') }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential flex bison m4 gawk libboost-dev zlib1g-dev python3 curl

      - name: Build the SDK (overlay + configure + compiler + sdcpp + toolchain + runtime)
        run: ./build.sh

      - name: Run the unified test suite (TAP)
        run: ./scripts/run-tests.sh

      # Package the relocatable SDK tarball (bin/ + libexec/ + share/sdcc/ +
      # docs + the hello starter) and keep it as a downloadable artifact, so a
      # green run doubles as a prebuilt-SDK build. The script re-verifies the
      # staged tree from a temp dir under a minimal env before tarring.
      - name: Package the SDK
        run: ./scripts/package-sdk.sh

      - name: Upload SDK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdcc88-sdk-linux-x64
          path: build/dist/sdcc88-sdk-*-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 30

  # linux-arm64: identical recipe on the arm64 hosted runner.
  test-linux-arm64:
    name: build & test (linux-arm64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Cache SDCC build tree
        uses: actions/cache@v4
        with:
          path: build
          key: sdcc-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.sh', 'third_party/sdcc/*.patch') }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential flex bison m4 gawk libboost-dev zlib1g-dev python3 curl

      - name: Build the SDK
        run: ./build.sh

      - name: Run the unified test suite (TAP)
        run: ./scripts/run-tests.sh

      - name: Package the SDK
        run: ./scripts/package-sdk.sh

      - name: Upload SDK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdcc88-sdk-linux-arm64
          path: build/dist/sdcc88-sdk-*-linux-arm64.tar.gz
          if-no-files-found: error
          retention-days: 30

  # linux-x86 (32-bit): no 32-bit hosted runners exist, so build with -m32
  # multilib on the x64 runner (CC/CXX="... -m32" — configure and every
  # component script honor them) and run the full suite natively via the
  # kernel's ia32 emulation. SDK_ARCH overrides package-sdk's uname-based
  # arch detection.
  test-linux-x86:
    name: build & test (linux-x86)
    runs-on: ubuntu-latest
    env:
      CC: gcc -m32
      CXX: g++ -m32
      SDK_ARCH: x86
    steps:
      - uses: actions/checkout@v4

      - name: Cache SDCC build tree
        uses: actions/cache@v4
        with:
          path: build
          key: sdcc-build-${{ runner.os }}-${{ runner.arch }}-m32-${{ hashFiles('build.sh', 'third_party/sdcc/*.patch') }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc-multilib g++-multilib lib32z1-dev \
            flex bison m4 gawk libboost-dev zlib1g-dev python3 curl

      - name: Build the SDK
        run: ./build.sh

      - name: Run the unified test suite (TAP)
        run: ./scripts/run-tests.sh

      - name: Package the SDK
        run: ./scripts/package-sdk.sh

      - name: Upload SDK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdcc88-sdk-linux-x86
          path: build/dist/sdcc88-sdk-*-linux-x86.tar.gz
          if-no-files-found: error
          retention-days: 30

  # Same build + full test suite + package on macOS (arm64 — Apple Silicon).
  # NOT the required check ("build & test" above gates main); this keeps the
  # darwin SDK honest and uploads its tarball. Apple's stock bison (2.3),
  # flex, make (3.81), and bash (3.2) are ancient and its awk lacks strtonum,
  # so the Homebrew versions go first on PATH; boost is header-only but lives
  # under the brew prefix, hence CPPFLAGS.
  test-macos:
    name: build & test (macos-arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache SDCC build tree
        uses: actions/cache@v4
        with:
          path: build
          key: sdcc-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.sh', 'third_party/sdcc/*.patch') }}

      - name: Install build dependencies (Homebrew)
        run: brew install boost bison flex gawk make bash

      - name: Put the Homebrew toolchain first on PATH
        run: |
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin"  >> "$GITHUB_PATH"
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
          echo "CPPFLAGS=-I$(brew --prefix)/include" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L$(brew --prefix)/lib" >> "$GITHUB_ENV"

      - name: Build the SDK (overlay + configure + compiler + sdcpp + toolchain + runtime)
        run: ./build.sh

      - name: Run the unified test suite (TAP)
        run: DIFF_SAVE_DIR="$PWD/build/diff-products" ./scripts/run-tests.sh

      # The differential suite's guest pipeline products (.asm/.ihx/.min per
      # case), kept even on failure so a host-dependent codegen divergence can
      # be byte-diffed against another platform's products offline.
      - name: Upload diff-test pipeline products
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diff-products-darwin-arm64
          path: build/diff-products/
          if-no-files-found: ignore
          retention-days: 7

      - name: Package the SDK
        run: ./scripts/package-sdk.sh

      - name: Upload SDK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdcc88-sdk-darwin-arm64
          path: build/dist/sdcc88-sdk-*-darwin-arm64.tar.gz
          if-no-files-found: error
          retention-days: 30

  # darwin-x64: same macOS recipe on the Intel runner (brew --prefix resolves
  # /usr/local there, so the PATH/flags wiring is identical).
  test-macos-x64:
    name: build & test (darwin-x64)
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Cache SDCC build tree
        uses: actions/cache@v4
        with:
          path: build
          key: sdcc-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.sh', 'third_party/sdcc/*.patch') }}

      - name: Install build dependencies (Homebrew)
        run: brew install boost bison flex gawk make bash

      - name: Put the Homebrew toolchain first on PATH
        run: |
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin"  >> "$GITHUB_PATH"
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
          echo "CPPFLAGS=-I$(brew --prefix)/include" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L$(brew --prefix)/lib" >> "$GITHUB_ENV"

      - name: Build the SDK
        run: ./build.sh

      - name: Run the unified test suite (TAP)
        run: ./scripts/run-tests.sh

      - name: Package the SDK
        run: ./scripts/package-sdk.sh

      - name: Upload SDK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdcc88-sdk-darwin-x64
          path: build/dist/sdcc88-sdk-*-darwin-x64.tar.gz
          if-no-files-found: error
          retention-days: 30

  # Same build + full test suite + package on Windows (x64, native MSYS2/MinGW64 —
  # the configuration the MSYS2 mingw-w64-sdcc package proves out; build.sh carries
  # its configure knobs + sdcpp wrapper workaround). NOT the required check; this
  # keeps the windows SDK honest and uploads its zip.
  test-windows:
    name: build & test (windows-x64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    env:
      MAKEFLAGS: -j4
    steps:
      # Git-for-Windows defaults core.autocrlf=true, which would CRLF-ify every
      # bash script and LF baseline at checkout — force LF.
      - name: Force LF checkout
        shell: pwsh
        run: git config --global core.autocrlf input

      - uses: actions/checkout@v4

      - name: Cache SDCC build tree
        uses: actions/cache@v4
        with:
          path: build
          key: sdcc-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.sh', 'third_party/sdcc/*.patch') }}

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-boost
            flex
            bison
            m4
            gawk
            make
            patch
            diffutils
            python
            curl
            zip
            git

      # the scripts preprocess with the host `cc`; MSYS2 names it gcc
      - name: Provide cc
        run: command -v cc >/dev/null 2>&1 || cp /mingw64/bin/gcc.exe /mingw64/bin/cc.exe

      - name: Build the SDK (overlay + configure + compiler + sdcpp + toolchain + runtime)
        run: ./build.sh

      - name: Run the unified test suite (TAP)
        run: DIFF_SAVE_DIR="$PWD/build/diff-products" ./scripts/run-tests.sh

      - name: Upload diff-test pipeline products
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diff-products-windows-x64
          path: build/diff-products/
          if-no-files-found: ignore
          retention-days: 7

      - name: Package the SDK
        run: ./scripts/package-sdk.sh

      - name: Upload SDK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdcc88-sdk-windows-x64
          path: build/dist/sdcc88-sdk-*-windows-x64.zip
          if-no-files-found: error
          retention-days: 30
